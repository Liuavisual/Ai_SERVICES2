spring:
  application:
    name: delta-ai-customer-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/delta_ai_customer_service?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 200
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      keep-alive: true
      phy-timeout-millis: 60000
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
      stat:
        slow-sql-millis: 1000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      password: ${REDIS_PASSWORD:123456}
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10
          max-wait: 3000ms
        shutdown-timeout: 200ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.delta.common.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_CN
  production: false

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    "[com.delta]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

wx:
  mp:
    enabled: false
    app-id: ${WX_MP_APP_ID:}
    secret: ${WX_MP_SECRET:}
    token: ${WX_MP_TOKEN:}
    aes-key: ${WX_MP_AES_KEY:}

# DeepSeek AI 配置
deepseek:
  # 是否启用 DeepSeek AI 回复 (true/false)
  enabled: false
  # DeepSeek API Key (请在此处配置你的 API Key)
  # 获取地址: https://platform.deepseek.com/
  # 示例: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  api-key: ${DEEPSEEK_API_KEY:}
  # DeepSeek API 地址
  api-url: https://api.deepseek.com/v1/chat/completions
  # 使用的模型 (deepseek-chat / deepseek-coder)
  model: deepseek-chat
  # 系统提示词 (定义AI的角色和行为)
  system-prompt: |
    你是三角洲行动陪玩俱乐部的AI客服助手。
    
    你的职责：
    1. 热情友好地回答用户的所有问题，包括关于游戏、价格、陪玩师、预约流程等
    2. 利用你掌握的知识，主动为用户提供帮助
    3. 只有在以下情况才建议转人工客服：
       - 用户明确要求找人工客服
       - 涉及复杂的个人订单问题需要人工核实
       - 需要处理退款、投诉等特殊敏感问题
    4. 回答问题时要专业、耐心、亲切
    5. 如果有FAQ知识库，请优先参考FAQ中的内容
    6. 对于游戏相关的基本问题，你可以基于常识给出回答
  # 最大 token 数
  max-tokens: 1000
  # 温度参数 (0-2, 越高越随机)
  temperature: 0.7
  # 请求超时时间(毫秒)
  timeout: 30000

# JWT 认证配置
jwt:
  enabled: false
  secret: ${JWT_SECRET:}
  # Token 有效期 (毫秒) - 默认2小时
  expiration: ${JWT_EXPIRATION:7200000}
  # Refresh Token 有效期 (毫秒) - 默认7天
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # 签发者
  issuer: delta-ai-customer-service
  # 受众
  audience: delta-admin

