spring:
  application:
    name: delta-ai-customer-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.delta.common.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: test-jwt-secret-key-for-unit-testing-only-2024
  expiration: 900
  refresh-expiration: 604800000
  issuer: test-issuer
  audience: test-audience

deepseek:
  api-key: test-api-key
  base-url: https://api.deepseek.com
  enabled: false

wx:
  mp:
    enabled: false

logging:
  level:
    com.delta: DEBUG
