<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='%236366F1'/%3E%3Cpath d='M16 10v12M10 16h12' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#304156" />
    <meta name="description" content="Delta AI - 智能客服管理系统" />

    <title>Delta AI 客服管理系统</title>

    <style>
      /* 关键内联样式：避免Vue挂载前的白屏闪烁 */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      /* 初始加载指示器 */
      .app-init-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        color: #909399;
        font-size: 14px;
      }

      .app-init-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }

      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 初始加载占位：Vue挂载后自动移除 -->
      <div class="app-init-loader">
        <div class="app-init-spinner"></div>
        <span>系统加载中...</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
