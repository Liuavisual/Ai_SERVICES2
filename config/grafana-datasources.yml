# ============================================================
# Delta AI 客服系统 - Grafana 数据源配置
# Grafana 启动时自动加载预配置的数据源
# @author 刘建国
# ============================================================

apiVersion: 1

# 删除已有数据源后重新创建（保证版本一致性）
deleteDatasources: []

# 数据源定义列表
datasources:
  # --- Prometheus 时序数据库数据源 ---
  # 用于采集后端服务的 CPU、JVM 内存、HTTP 吞吐、业务指标等
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus-delta
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
      exemplarTraceIdDestinations:
        - name: Jaeger
          datasourceUid: jaeger

  # --- Loki 日志聚合数据源 ---
  # 关联 Promtail 采集的日志，实现指标→日志反向关联查询
  - name: Loki
    type: loki
    access: proxy
    uid: loki-delta
    url: http://loki:3100
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: ""
          datasourceUid: ""